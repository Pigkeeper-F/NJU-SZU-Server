<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">研究工作台总体设计</title>
  <desc id="desc">固定模块通过本地代理向模型注入工作流文档；业务草稿中活动数据和参数数据汇入计算，人工审核后绘图。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif;fill:#24364e}.title{font-size:27px;font-weight:600}.section{font-size:18px;font-weight:600}.label{font-size:16px}.note{font-size:13px;fill:#64748b}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.line{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}.draft{stroke-dasharray:6 5}</style>
  </defs>
  <rect width="1200" height="800" fill="#f5f7fb"/>
  <text x="40" y="48" class="title">研究工作台 · 工作流驱动的 AI 辅助</text>
  <text x="40" y="76" class="note">当前实现：模块化对话 + 文档提示注入　｜　业务设计：数据/参数交接、审核与回退</text>
  <rect x="30" y="100" width="1140" height="195" rx="16" fill="#eaf0f8"/>
  <text x="50" y="132" class="section">01　固定研究模块 · 每个模块独立对话</text>
  <g class="label" text-anchor="middle">
    <rect x="50" y="155" width="155" height="48" class="box"/><text x="127" y="185">下载数据</text>
    <rect x="225" y="155" width="155" height="48" class="box"/><text x="302" y="185">数据清洗</text>
    <rect x="400" y="155" width="155" height="48" class="box"/><text x="477" y="185">计算</text>
    <rect x="575" y="155" width="155" height="48" class="box"/><text x="652" y="185">文献挖掘</text>
    <rect x="750" y="155" width="155" height="48" class="box"/><text x="827" y="185">人工审核</text>
    <rect x="925" y="155" width="195" height="48" class="box"/><text x="1022" y="185">绘图 · 展示规律</text>
    <rect x="400" y="223" width="155" height="42" class="box"/><text x="477" y="250">参数更新</text>
    <rect x="575" y="223" width="155" height="42" class="box"/><text x="652" y="250">活动数据更新</text>
  </g>
  <text x="50" y="247" class="note">计算方式可插入更新子模块 →</text>
  <rect x="30" y="315" width="1140" height="210" rx="16" fill="#fff" stroke="#dce3ed"/>
  <text x="50" y="348" class="section">02　AI 请求 · 已实现</text>
  <g class="label" text-anchor="middle">
    <rect x="50" y="375" width="220" height="62" class="box"/><text x="160" y="401">用户消息 + 当前模块</text><text x="160" y="423" class="note">添加 API / 切换 AI 对话</text>
    <rect x="330" y="375" width="240" height="62" class="box"/><text x="450" y="401">本地服务 /api/ai/chat</text><text x="450" y="423" class="note">按模块读取并构造提示</text>
    <rect x="630" y="375" width="225" height="62" class="box"/><text x="742" y="401">DeepSeek / OpenAI</text><text x="742" y="423" class="note">工作流指导 + 模块对话</text>
    <rect x="915" y="375" width="205" height="62" class="box"/><text x="1017" y="401">回复与模块记录</text><text x="1017" y="423" class="note">补齐输入 · 推进 · 检查</text>
  </g>
  <path d="M270 406H330M570 406H630M855 406H915" class="line"/>
  <text x="50" y="478" class="label">工作流文档：定义 → 输入 → 执行 → 交付 → 检查 → 异常 + 需对齐内容</text>
  <text x="50" y="504" class="note">每次请求读取文档；待对齐项逐步确认。当前仅文字辅助，实际下载/计算需要后续接入工具。</text>
  <rect x="30" y="545" width="1140" height="220" rx="16" fill="#edf5f0"/>
  <text x="50" y="578" class="section">03　成果交接与审核 · 业务草稿，尚未自动执行</text>
  <g class="label" text-anchor="middle">
    <rect x="50" y="600" width="275" height="48" class="box"/><text x="187" y="630">下载 → 清洗 → 活动数据更新</text>
    <rect x="50" y="668" width="275" height="48" class="box"/><text x="187" y="698">文献挖掘 → 参数更新</text>
    <rect x="385" y="634" width="165" height="48" class="box"/><text x="467" y="664">输入 / 对齐审核</text>
    <rect x="605" y="634" width="130" height="48" class="box"/><text x="670" y="664">计算</text>
    <rect x="790" y="634" width="150" height="48" class="box"/><text x="865" y="664">结果人工审核</text>
    <rect x="995" y="634" width="125" height="48" class="box"/><text x="1057" y="664">绘图</text>
  </g>
  <path d="M325 624H355V650H385M325 692H355V666H385M550 658H605M735 658H790M940 658H995" class="line draft"/>
  <text x="385" y="714" class="note">审核不通过：按数据 / 参数 / 对齐 / 代码问题回退</text>
  <text x="50" y="746" class="note">需对齐：执行依赖、审核节点、版本与状态、跨模块成果传递、实际执行工具。</text>
</svg>
